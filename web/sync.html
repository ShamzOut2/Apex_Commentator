<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Free / Sync</title>
  <link rel="stylesheet" href="sync.css">
</head>
<body>
  <!-- The co-commentator's FREE | SYNC switch, in a small window of its own
       on top of iRacing (opened from the app). Click it to switch between
       your own camera (FREE) and the host's (SYNC). -->
  <div class="widget">
    <span class="grip pywebview-drag-region" title="Drag to move">⠿</span>
    <button id="pill" class="pill off" title="FREE: your own camera. SYNC: the host's. Click to switch.">
      <span class="s-free">FREE</span><span class="s-sync">SYNC</span>
    </button>
    <span id="status" class="status pywebview-drag-region">Not following</span>
    <button id="close" class="close" title="Close">✕</button>
  </div>
  <script src="common.js"></script>
  <script src="sync.js"></script>
</body>
</html>
