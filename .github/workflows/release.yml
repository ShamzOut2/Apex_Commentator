# Publishes a GitHub release for the app version in apex/__init__.py, with the
# Windows installer attached. Installed apps check the latest release and
# offer it as an update.
#
# Runs when:
#  - a commit that changes apex/__init__.py lands on main (a version bump), or
#  - a version tag (v1.2.3) is pushed.
# A version that already has a release is skipped, so re-runs are harmless.
name: Release

on:
  push:
    branches: [main]
    paths: [apex/__init__.py]
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      skip: ${{ steps.version.outputs.skip }}
    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' apex/__init__.py)
          tag="v$version"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match apex/__init__.py version $version"
            exit 1
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $tag already exists: nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    if: needs.version.outputs.skip != 'true'
    uses: ./.github/workflows/build.yml

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: windows-app
          path: release-files

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          # The notes are this version's CHANGELOG.md section ("Unreleased" if it
          # hasn't been renamed yet): the app shows them in its update pop-up.
          python3 -m apex.changelog --notes "$TAG" > release-notes.md || true
          if [ -s release-notes.md ]; then
            notes=(--notes-file release-notes.md)
          else
            notes=(--generate-notes)
          fi
          # Creates the tag on this commit if it doesn't exist yet.
          gh release create "$TAG" release-files/* --title "$TAG" --target "$GITHUB_SHA" "${notes[@]}"
