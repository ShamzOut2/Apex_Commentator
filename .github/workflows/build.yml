# Builds the Windows app and installer, and checks they actually start.
# Runs on branch pushes and pull requests, and is reused by the release workflow.
name: Build Windows app

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_call:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-desktop.txt pyinstaller

      - name: Run tests
        run: python -m unittest discover -s tests -t .

      - name: Build the app
        run: pyinstaller packaging/apex.spec --noconfirm

      - name: Smoke-test the app
        shell: pwsh
        run: |
          $p = Start-Process dist\ApexCommentator\ApexCommentator.exe -ArgumentList "--smoke-test" -Wait -PassThru
          Get-Content "$env:APPDATA\Apex Commentator\apex.log" -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "Smoke test failed ($($p.ExitCode))" }

      - name: Build the installer
        shell: pwsh
        run: |
          $version = (Select-String -Path apex\__init__.py -Pattern '__version__ = "(.*)"').Matches[0].Groups[1].Value
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          & $iscc "/DAppVersion=$version" packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Installer build failed" }
          Compress-Archive -Path dist\ApexCommentator -DestinationPath "dist\ApexCommentator-$version-windows-portable.zip"

      - name: Install it and smoke-test the installed app
        shell: pwsh
        run: |
          $setup = "dist\ApexCommentator-Setup-$env:APP_VERSION.exe"
          $p = Start-Process $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$env:RUNNER_TEMP\apex-install" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Installer failed ($($p.ExitCode))" }
          $p = Start-Process "$env:RUNNER_TEMP\apex-install\ApexCommentator.exe" -ArgumentList "--smoke-test" -Wait -PassThru
          Get-Content "$env:APPDATA\Apex Commentator\apex.log" -Tail 5 -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "Installed app smoke test failed ($($p.ExitCode))" }

      - uses: actions/upload-artifact@v4
        with:
          name: windows-app
          path: |
            dist/ApexCommentator-Setup-*.exe
            dist/ApexCommentator-*-windows-portable.zip
          if-no-files-found: error
